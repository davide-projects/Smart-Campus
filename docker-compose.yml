# Avvio locale completo: docker compose up --build
# Prerequisito: copiare .env.example in .env
name: smartcampus

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Imposta MSSQL_SA_PASSWORD nel file .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Imposta RABBITMQ_USER nel file .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Imposta RABBITMQ_PASSWORD nel file .env}
    ports:
      - "5672:5672"
      - "15672:15672"

  identity:
    build: { context: ., dockerfile: src/Services/Identity/SmartCampus.Identity.Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=sqlserver,1433;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Database=SmartCampus_Identity"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Imposta JWT_SIGNING_KEY nel file .env}
      Seed__DefaultPassword: ${SEED_DEFAULT_PASSWORD:?Imposta SEED_DEFAULT_PASSWORD nel file .env}
    depends_on:
      sqlserver:
        condition: service_healthy

  rooms:
    build: { context: ., dockerfile: src/Services/Rooms/SmartCampus.Rooms.Api/Dockerfile }
    environment:
      ConnectionStrings__Database: "Server=sqlserver,1433;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Database=SmartCampus_Rooms"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  bookings:
    build: { context: ., dockerfile: src/Services/Bookings/SmartCampus.Bookings.Api/Dockerfile }
    environment:
      ConnectionStrings__Database: "Server=sqlserver,1433;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Database=SmartCampus_Bookings"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gateway:
    build: { context: ., dockerfile: src/Gateway/SmartCampus.Gateway/Dockerfile }
    environment:
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity:8080
      ReverseProxy__Clusters__rooms__Destinations__d1__Address: http://rooms:8080
      ReverseProxy__Clusters__bookings__Destinations__d1__Address: http://bookings:8080
      Cors__AllowedOrigins__0: http://localhost:4200
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Imposta JWT_SIGNING_KEY nel file .env}
    ports:
      - "5000:8080"
    depends_on: [identity, rooms, bookings]

  web:
    build: { context: ./frontend }
    ports:
      - "4200:8080"
    depends_on: [gateway]

volumes:
  sqlserver-data:
