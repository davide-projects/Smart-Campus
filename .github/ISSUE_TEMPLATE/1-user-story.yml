name: User Story
description: User story nel formato concordato. I task tecnici vanno creati come sub-issue.
title: "[US-xx] - "
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: |
        Titolo: **[ID] - Titolo della User Story** (es. `[US-04] - Prenotare uno spazio`).
        Dopo aver creato la storia, aggiungi i task con **Create sub-issue**.
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      value: |
        Come [tipo di utente / ruolo]
        voglio [funzionalità / azione]
        in modo da [beneficio / valore ottenuto].
    validations:
      required: true
  - type: textarea
    id: descrizione
    attributes:
      label: Descrizione
      description: Cosa deve essere realizzato e in quale contesto verrà utilizzato. Cosa deve fare il sistema, senza dettagli tecnici di implementazione.
    validations:
      required: true
  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
      value: |
        La storia è considerata completata quando:
        - [ ] [Criterio di accettazione 1]
        - [ ] [Criterio di accettazione 2]
        - [ ] [Criterio di accettazione 3]
    validations:
      required: true
  - type: dropdown
    id: story-point
    attributes:
      label: Story Point
      description: Stima
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
    validations:
      required: true
