name: User Story
description: Bisogno di un attore, concordato con il PO. I task tecnici vanno creati come sub-issue.
title: "[US] "
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: |
        Una storia descrive **un bisogno e il valore atteso**, non una soluzione tecnica.
        Riferimento: `docs/handoff-architettura.md`. Dopo averla creata, aggiungi i task con **Create sub-issue**.
  - type: input
    id: storia
    attributes:
      label: Storia
      placeholder: "Come studente voglio prenotare uno spazio per una fascia oraria così da avere la certezza di poterlo usare"
    validations:
      required: true
  - type: dropdown
    id: epica
    attributes:
      label: Epica
      options:
        - E1. Trovare uno spazio
        - E2. Prenotare senza conflitti
        - E3. Gestire le mie prenotazioni
        - E4. Accesso e ruoli
        - E5. Gestire il catalogo
        - E6. Registrare l'utilizzo effettivo
        - E7. Comprendere l'utilizzo
        - E8. Qualità, avvio e prove
    validations:
      required: true
  - type: dropdown
    id: priorita
    attributes:
      label: Priorità concordata con il PO
      options:
        - Must
        - Should
        - Could
    validations:
      required: true
  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
      description: Risultati osservabili, formato Dato / Quando / Allora, con dati sintetici.
      value: |
        - [ ] **CA-1** Dato … quando … allora …
        - [ ] **CA-2** Dato … quando … allora …
    validations:
      required: true
  - type: checkboxes
    id: servizi
    attributes:
      label: Servizi coinvolti
      options:
        - label: Identity
        - label: Catalogo
        - label: Prenotazioni
        - label: Utilizzo
        - label: Gateway
        - label: Frontend
  - type: input
    id: invarianti
    attributes:
      label: Invarianti / regole
      placeholder: "INV-1, INV-3"
  - type: textarea
    id: seed
    attributes:
      label: Dati sintetici necessari
  - type: textarea
    id: domande
    attributes:
      label: Assunzioni e domande aperte
      description: Riferimenti I-x dell'handoff. Le assunzioni vanno validate con il PO.
