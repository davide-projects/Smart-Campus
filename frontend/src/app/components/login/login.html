<section class="login">
  <h1>Accedi</h1>

  @if (sessionExpired) {
    <p class="notice" role="status">La sessione è scaduta, accedi di nuovo.</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Nome utente</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
      <mat-error>Inserisci il nome utente.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error>Inserisci la password.</mat-error>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button matButton="filled" type="submit" [disabled]="submitting()">Accedi</button>
  </form>
</section>
