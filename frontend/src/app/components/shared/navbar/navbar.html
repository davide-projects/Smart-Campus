<mat-toolbar class="navbar">
  <span class="brand">SmartCampus</span>

  <nav class="links" aria-label="Navigazione principale">
    @for (link of links(); track link.path) {
      <a matButton [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ link.label }}
      </a>
    }
  </nav>

  @if (user(); as user) {
    <button matButton class="user-toggle" [matMenuTriggerFor]="userMenu" [attr.aria-label]="'Account di ' + user.displayName">
      <mat-icon fontSet="material-symbols-outlined">account_circle</mat-icon>
      <span class="user-name">{{ user.displayName }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-info">
        <span class="user-info-name">{{ user.displayName }}</span>
        <span class="user-info-role">{{ roleLabel(user.role) }}</span>
      </div>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        Esci
      </button>
    </mat-menu>
  } @else {
    <a matButton="outlined" routerLink="/login">Accedi</a>
  }

  <!-- Su mobile le voci stanno in un menu a scomparsa. -->
  <button matIconButton class="menu-toggle" [matMenuTriggerFor]="mobileMenu" aria-label="Apri il menu">
    <mat-icon fontSet="material-symbols-outlined">menu</mat-icon>
  </button>
  <mat-menu #mobileMenu="matMenu">
    @for (link of links(); track link.path) {
      <a mat-menu-item [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ link.label }}
      </a>
    }
  </mat-menu>
</mat-toolbar>
