server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Le chiamate API passano dal gateway (nome del servizio in docker-compose).
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
  }

  # Routing lato client di Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
